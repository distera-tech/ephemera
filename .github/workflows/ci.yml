name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ephemera
          POSTGRES_PASSWORD: ephemera
          POSTGRES_DB: ephemera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ephemera" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ephemera:ephemera@localhost:5432/ephemera_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: bash -n ../../infra/gpu/bootstrap.sh
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "SIMULATION_TIME_SCALE=0.5" >> .env
      - run: docker compose -f infra/docker-compose.yml up --build -d
      - name: Wait for readiness (API + worker)
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:3000/api/readiness | grep -q '"worker":"ok"' && exit 0; sleep 3
          done
          docker compose -f infra/docker-compose.yml logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
